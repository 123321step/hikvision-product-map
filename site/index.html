<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hikvision Product Map</title>
  <style>
    :root {
      --bg: #f5f0e8;
      --panel: #fffaf4;
      --text: #1d2a33;
      --muted: #61717b;
      --line: #dccfbe;
      --brand: #c6362e;
      --brand-soft: #f4ddda;
      --accent: #20455e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #fff5e3 0, transparent 28%),
        radial-gradient(circle at top right, #f8dfd6 0, transparent 24%),
        linear-gradient(180deg, #f6efe5 0%, #efe7db 100%);
    }
    .shell {
      max-width: 1360px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }
    .panel {
      background: rgba(255, 250, 244, 0.94);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 40px rgba(82, 52, 32, 0.08);
    }
    h1, h2, h3, p { margin-top: 0; }
    .lede { color: var(--muted); line-height: 1.6; }
    .tabs, .chips { display: flex; flex-wrap: wrap; gap: 10px; }
    button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      padding: 8px 14px;
      cursor: pointer;
    }
    button.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: #fff;
      margin-bottom: 14px;
    }
    .card h3 { margin-bottom: 8px; }
    .muted { color: var(--muted); }
    .tree ul {
      list-style: none;
      margin: 8px 0 0;
      padding-left: 18px;
      border-left: 1px solid var(--line);
    }
    .tree li {
      margin: 8px 0;
      position: relative;
    }
    .tree li::before {
      content: "";
      position: absolute;
      left: -18px;
      top: 12px;
      width: 12px;
      border-top: 1px solid var(--line);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      font-size: 14px;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #faf1e8;
      position: sticky;
      top: 0;
    }
    .scroll { overflow: auto; }
    .hero {
      background: linear-gradient(135deg, rgba(198,54,46,.08), rgba(32,69,94,.08));
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 10px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      margin-bottom: 10px;
    }
    .links a {
      color: var(--accent);
      text-decoration: none;
    }
    .links a:hover { text-decoration: underline; }
    @media (max-width: 980px) {
      .shell { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="panel">
      <h1>Hikvision Product Map</h1>
      <p class="lede">A public static catalog view generated from the local sample crawl. English currently shows model-level differences. Chinese currently shows the product family tree.</p>
      <div class="hero">
        <div class="badge">Public Preview</div>
        <p id="updated" class="muted"></p>
      </div>
      <h3>Language</h3>
      <div class="tabs">
        <button class="active" data-locale="cn">中文</button>
        <button data-locale="en">English</button>
      </div>
      <h3 style="margin-top:20px;">Series / Section</h3>
      <div id="series-list" class="chips"></div>
      <h3 style="margin-top:20px;">Source</h3>
      <div class="links">
        <a href="https://www.hikvision.com/en/products/" target="_blank" rel="noreferrer">Hikvision Global Products</a><br>
        <a href="https://www.hikvision.com/cn/products/" target="_blank" rel="noreferrer">海康威视产品中心</a><br>
        <a href="https://github.com/123321step/hikvision-product-map" target="_blank" rel="noreferrer">GitHub Repository</a>
      </div>
    </aside>
    <main class="panel">
      <div id="content"></div>
    </main>
  </div>
  <script>
    const data = {
      updatedAt: "2026-04-13",
      cn: {
        title: "中文产品目录",
        summary: "当前公开页先展示海康中文站的目录树样本，覆盖前端产品中的固定网络摄像机、防爆网络摄像机和球型网络摄像机等主要分类。",
        sections: [
          { name: "固定网络摄像机", items: ["经销系列", "2系列通用网络摄像机", "2系列智能网络摄像机", "5系列通用网络摄像机", "5系列智能网络摄像机", "6系列专用网络摄像机", "7系列智能网络摄像机", "8系列智能网络摄像机", "专用网络摄像机"] },
          { name: "防爆网络摄像机", items: ["矿用煤安产品系列", "防爆筒机", "防爆球机", "防爆云台"] },
          { name: "球型网络摄像机", items: ["鹰眼系列", "行业智能球机"] }
        ]
      },
      en: {
        title: "English Model Differences",
        summary: "The current public sample includes one English series with model-level spec comparison: Pro Series network cameras.",
        sections: [
          {
            name: "Pro Series",
            description: "Sampled from Hikvision Global > Products > IP Products > Network Cameras > Pro Series.",
            models: [
              "DS-2CD2125FHWD-I(S)",
              "DS-2CD2145FWD-I(S)",
              "DS-2CD2165G0-I(S)"
            ],
            differences: [
              {
                field: "Camera > Image Sensor",
                values: ["1/2.8\" Progressive Scan CMOS", "1/2.7\" Progressive Scan CMOS", "1/2.4\" Progressive Scan CMOS"]
              },
              {
                field: "Video > Max. Resolution",
                values: ["1920 × 1080", "2688 × 1520", "3072 × 2048"]
              },
              {
                field: "Lens > Lens Type",
                values: ["2.8/4/6/8/12 mm", "2.8/4/6/8/12 mm", "2.8/4/6 mm"]
              },
              {
                field: "General > Power Supply",
                values: ["12 VDC ±25%, 6 W; PoE 7 W", "12 VDC ±25%, PoE (802.3af class 3)", "12 VDC ±25%, PoE (802.3af class 3)"]
              },
              {
                field: "Event > Smart Event",
                values: ["Line crossing, intrusion, unattended baggage, object removal", "Line crossing, intrusion, unattended baggage, object removal", "Line crossing, intrusion"]
              }
            ]
          }
        ]
      }
    };

    const state = { locale: "cn", section: null };
    const updated = document.getElementById("updated");
    const seriesList = document.getElementById("series-list");
    const content = document.getElementById("content");
    updated.textContent = "Updated: " + data.updatedAt;

    function renderTree(section) {
      return `<div class="card tree"><h3>${section.name}</h3><ul>${section.items.map(item => `<li>${item}</li>`).join("")}</ul></div>`;
    }

    function renderDiff(section) {
      const head = section.models.map(model => `<th>${model}</th>`).join("");
      const rows = section.differences.map(diff => `<tr><td>${diff.field}</td>${diff.values.map(value => `<td>${value}</td>`).join("")}</tr>`).join("");
      return `<div class="card"><h3>${section.name}</h3><p class="muted">${section.description}</p><div class="scroll"><table><thead><tr><th>Field</th>${head}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }

    function render() {
      const locale = data[state.locale];
      const sections = locale.sections;
      const selected = sections.find(s => s.name === state.section) || sections[0];
      state.section = selected ? selected.name : null;

      seriesList.innerHTML = sections.map(section => `<button class="${section.name === state.section ? "active" : ""}" data-section="${section.name}">${section.name}</button>`).join("");

      let html = `<div class="hero"><div class="badge">${state.locale === "cn" ? "中文视图" : "English View"}</div><h2>${locale.title}</h2><p class="lede">${locale.summary}</p></div>`;
      if (state.locale === "cn") {
        html += sections.map(renderTree).join("");
      } else {
        html += renderDiff(selected);
      }
      content.innerHTML = html;
    }

    document.querySelector(".tabs").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-locale]");
      if (!btn) return;
      state.locale = btn.dataset.locale;
      state.section = null;
      document.querySelectorAll(".tabs button").forEach(button => button.classList.toggle("active", button === btn));
      render();
    });

    seriesList.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-section]");
      if (!btn) return;
      state.section = btn.dataset.section;
      render();
    });

    render();
  </script>
</body>
</html>
