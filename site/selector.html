<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HiTools Style Product Selector</title>
  <style>
    :root {
      --blue: #2867f0;
      --blue-dark: #1e52cf;
      --line: #d8d8d8;
      --line-soft: #ececec;
      --text: #111;
      --muted: #8a8a8a;
      --panel: #fff;
      --bg: #f5f5f5;
      --rail: #f2f3f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 14px;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--blue); text-decoration: none; }
    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: 48px 1fr;
      background: #fff;
    }
    .rail {
      background: var(--rail);
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 12px;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 8px;
    }
    .rail-btn {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: #555;
      display: grid;
      place-items: center;
      position: relative;
    }
    .rail-btn.active { background: #fff; color: var(--blue); }
    .rail-btn.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 7px;
      bottom: 7px;
      width: 3px;
      background: var(--blue);
    }
    .main-shell {
      min-width: 0;
      display: grid;
      grid-template-rows: 41px 52px 1fr;
      height: 100vh;
    }
    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px 0 12px;
    }
    .save-btn {
      height: 32px;
      min-width: 216px;
      border: 1px solid var(--blue);
      color: var(--blue);
      background: #fff;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 0 14px;
    }
    .top-right {
      display: flex;
      align-items: center;
      gap: 18px;
      color: #111;
    }
    .lang-toggle {
      border: 0;
      background: transparent;
      color: #111;
      padding: 0;
      height: 32px;
    }
    .login {
      min-width: 84px;
      height: 32px;
      border: 0;
      border-radius: 3px;
      background: var(--blue);
      color: #fff;
    }
    .searchbar {
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(360px, 544px) 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 8px 24px 8px 12px;
    }
    .searchbox {
      height: 34px;
      display: grid;
      grid-template-columns: 1fr 36px;
      border: 1px solid var(--blue);
      background: #fff;
    }
    .searchbox input {
      border: 0;
      outline: 0;
      padding: 0 12px;
      color: #444;
    }
    .searchbox button {
      border: 0;
      background: var(--blue);
      color: #fff;
      font-size: 18px;
    }
    .selected-top {
      height: 36px;
      border: 0;
      background: var(--blue);
      color: #fff;
      min-width: 222px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 304px minmax(0, 1fr);
      background: #fff;
      position: relative;
      overflow: hidden;
    }
    .directory {
      min-height: 0;
      border-right: 1px solid var(--line);
      padding: 12px 12px 0;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 12px;
      background: #fff;
    }
    .dir-search, .brand-select {
      height: 32px;
      border: 1px solid #bfbfbf;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      color: #555;
      background: #fff;
    }
    .dir-search input {
      border: 0;
      outline: 0;
      min-width: 0;
      flex: 1;
      height: 100%;
    }
    .brand-select {
      justify-content: space-between;
      font-size: 14px;
    }
    .category-list {
      min-height: 0;
      overflow: auto;
      padding-bottom: 12px;
    }
    .category-row {
      height: 32px;
      display: grid;
      grid-template-columns: 16px 18px 1fr auto;
      align-items: center;
      gap: 7px;
      color: #111;
      white-space: nowrap;
      cursor: pointer;
      padding-right: 6px;
    }
    .category-row:hover, .category-row.active { background: #f4f7ff; color: var(--blue); }
    .twisty { color: #777; font-size: 18px; line-height: 1; }
    .box {
      width: 16px;
      height: 16px;
      border: 1px solid #bcbcbc;
      background: #f7f7f7;
      display: grid;
      place-items: center;
      font-size: 12px;
      color: var(--blue);
    }
    .category-row.active .box::after { content: "✓"; }
    .category-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cat-count {
      color: var(--muted);
      font-size: 12px;
    }
    .clear-all {
      height: 42px;
      border-top: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--blue);
      font-size: 13px;
    }
    .catalog {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 46px 1fr;
      background: #fff;
    }
    .catalog-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--line-soft);
    }
    .catalog-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #333;
    }
    .checkbox-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #333;
    }
    .small-box {
      width: 16px;
      height: 16px;
      border: 1px solid #bbb;
      display: inline-block;
      background: #fff;
    }
    .sort-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sort-select {
      height: 32px;
      min-width: 156px;
      border: 1px solid #bbb;
      padding: 0 8px;
      background: #fff;
    }
    .view-btn {
      width: 34px;
      height: 32px;
      border: 1px solid #bbb;
      background: #fff;
      color: #555;
    }
    .view-btn.active {
      border-color: var(--blue);
      color: var(--blue);
      background: #eef4ff;
    }
    .product-grid {
      min-height: 0;
      overflow: auto;
      padding: 14px 24px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
      gap: 16px;
      align-content: start;
      background: #fff;
    }
    .product-card {
      height: 180px;
      border: 1px solid #ddd;
      background: #fff;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-rows: 88px 1fr;
    }
    .product-card:hover {
      border-color: #c8c8c8;
      box-shadow: 0 4px 10px rgba(0,0,0,.08);
    }
    .result-note {
      grid-column: 1 / -1;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      border: 1px dashed #d7d7d7;
      background: #fbfbfb;
    }
    .tag-row {
      position: absolute;
      right: 10px;
      top: 10px;
      display: flex;
      gap: 6px;
      align-items: center;
      z-index: 2;
    }
    .mini-tag {
      height: 16px;
      min-width: 18px;
      border: 1px solid #777;
      color: #444;
      font-size: 9px;
      line-height: 14px;
      text-align: center;
      background: #fff;
    }
    .star { font-size: 20px; color: #666; line-height: 1; }
    .visual {
      display: grid;
      place-items: center;
      padding-top: 20px;
    }
    .device {
      position: relative;
      width: 118px;
      height: 60px;
      transform: scale(.86);
    }
    .device.camera::before {
      content: "";
      position: absolute;
      left: 18px;
      top: 16px;
      width: 72px;
      height: 30px;
      border-radius: 7px 18px 18px 7px;
      background: linear-gradient(90deg, #30343a 0 26%, #eceef0 27% 100%);
      box-shadow: 0 4px 8px rgba(0,0,0,.16);
    }
    .device.camera::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 12px;
      width: 42px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 42% 48%, #171d24 0 6px, #cbd0d5 7px 17px, #f7f8f9 18px);
      box-shadow: 0 4px 8px rgba(0,0,0,.14);
    }
    .device.ptz::before {
      content: "";
      position: absolute;
      left: 30px;
      top: 6px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 48%, #1d2228 0 8px, #d8dce0 9px 19px, #f4f5f6 20px);
      box-shadow: 0 2px 7px rgba(0,0,0,.16);
    }
    .device.boxy::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 11px;
      width: 76px;
      height: 34px;
      border-radius: 4px;
      background: linear-gradient(180deg, #f6f7f8, #ccd1d6);
      border: 1px solid #aeb4ba;
      box-shadow: inset 0 -8px 12px rgba(0,0,0,.08);
    }
    .device.panel::before {
      content: "";
      position: absolute;
      left: 28px;
      top: 5px;
      width: 46px;
      height: 46px;
      border-radius: 4px;
      background: linear-gradient(180deg, #eef3f7, #cfd7df);
      border: 1px solid #aeb8c0;
    }
    .device.panel::after {
      content: "";
      position: absolute;
      left: 40px;
      top: 17px;
      width: 22px;
      height: 15px;
      background: #29313a;
      border-radius: 2px;
    }
    .card-info {
      padding: 2px 12px 10px;
      min-width: 0;
    }
    .product-title {
      font-weight: 700;
      line-height: 18px;
      height: 38px;
      overflow: hidden;
      color: #0a0a0a;
      word-break: break-word;
    }
    .product-desc {
      margin-top: 5px;
      color: #9b9b9b;
      line-height: 18px;
      height: 36px;
      overflow: hidden;
    }
    .new-tag {
      display: inline-block;
      color: #f04d4f;
      border: 1px solid #ffd2d2;
      background: #fff6f6;
      padding: 0 4px;
      margin-left: 4px;
      font-size: 11px;
    }
    .hover-actions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 40px;
      display: none;
      grid-template-columns: 1fr 1fr;
      background: rgba(0,0,0,.78);
    }
    .product-card:hover .hover-actions { display: grid; }
    .hover-actions button {
      border: 0;
      color: #fff;
      background: transparent;
      border-right: 1px solid rgba(255,255,255,.25);
    }
    .hover-actions button:last-child { border-right: 0; }
    .selection {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(430px, calc(100vw - 64px));
      min-width: 0;
      min-height: 0;
      border-left: 1px solid var(--line);
      display: grid;
      grid-template-rows: 42px auto 1fr auto;
      background: #fff;
      z-index: 8;
      box-shadow: -8px 0 22px rgba(0,0,0,.12);
      transform: translateX(102%);
      transition: transform .18s ease;
    }
    .workspace.drawer-open .selection {
      transform: translateX(0);
    }
    .drawer-close {
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 20px;
      line-height: 1;
    }
    .selected-head {
      background: var(--blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
    }
    .selected-head strong { font-weight: 500; }
    .scenario-panel {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }
    .scenario-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }
    .scenario-row select, .scenario-row button {
      height: 32px;
      border: 1px solid #bbb;
      background: #fff;
    }
    .scenario-row button {
      padding: 0 10px;
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }
    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .metric input {
      width: 100%;
      height: 28px;
      border: 1px solid #cfcfcf;
      padding: 0 6px;
    }
    .metric label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .selected-list {
      min-height: 0;
      overflow: auto;
      padding: 10px 12px;
      display: grid;
      gap: 8px;
      align-content: start;
      background: #fbfbfb;
    }
    .selected-item {
      background: #fff;
      border: 1px solid #ddd;
      padding: 9px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }
    .selected-item strong {
      display: block;
      line-height: 17px;
      font-size: 12px;
      max-height: 34px;
      overflow: hidden;
    }
    .selected-item span {
      display: block;
      color: var(--muted);
      margin-top: 4px;
      font-size: 12px;
    }
    .qty-controls {
      display: grid;
      grid-template-columns: 24px 38px 24px;
      align-items: center;
      gap: 2px;
    }
    .qty-controls button {
      width: 24px;
      height: 24px;
      border: 1px solid #ccc;
      background: #fff;
    }
    .qty-controls input {
      width: 38px;
      height: 24px;
      text-align: center;
      border: 1px solid #ccc;
      padding: 0;
    }
    .selected-actions {
      border-top: 1px solid var(--line);
      background: #fff;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 360px;
    }
    .tool-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--line);
    }
    .tool-tabs button {
      height: 34px;
      border: 0;
      background: #fff;
      border-right: 1px solid var(--line);
    }
    .tool-tabs button.active {
      color: var(--blue);
      border-bottom: 2px solid var(--blue);
    }
    .output-body {
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto;
    }
    #topologyRender {
      min-height: 210px;
      overflow: auto;
      background: #fff;
      padding: 8px;
    }
    #topologyRender svg {
      min-width: 100%;
      height: auto;
    }
    .bom {
      max-height: 170px;
      overflow: auto;
      border-top: 1px solid var(--line);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      padding: 7px 6px;
      border-bottom: 1px solid #ececec;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f7f7f7; position: sticky; top: 0; }
    .export-row {
      display: flex;
      gap: 8px;
      padding: 8px;
      border-top: 1px solid var(--line);
    }
    .export-row button {
      flex: 1;
      height: 30px;
      border: 1px solid var(--blue);
      color: var(--blue);
      background: #fff;
    }
    .empty {
      height: 100%;
      min-height: 120px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }
    @media (max-width: 1180px) {
      body { overflow: auto; }
      .app { min-height: 100vh; height: auto; }
      .main-shell { height: auto; min-height: 100vh; }
      .workspace { grid-template-columns: 280px 1fr; }
      .selection { position: fixed; top: 0; right: 0; bottom: 0; min-height: 560px; border-left: 1px solid var(--line); border-top: 0; }
    }
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .rail { display: none; }
      .searchbar { grid-template-columns: 1fr; }
      .workspace { grid-template-columns: 1fr; }
      .directory { border-right: 0; border-bottom: 1px solid var(--line); max-height: 380px; }
      .topbar { padding-right: 10px; }
      .save-btn { min-width: 0; }
      .top-right { gap: 8px; }
      .product-grid { grid-template-columns: 1fr; }
    }
  </style>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: "base", themeVariables: { primaryColor: "#f2f6ff", primaryBorderColor: "#2867f0", lineColor: "#777", fontFamily: "Arial, Microsoft YaHei, sans-serif" } });
    window.mermaid = mermaid;
    window.dispatchEvent(new Event("mermaid-ready"));
  </script>
</head>
<body>
  <div class="app">
    <nav class="rail">
      <div class="logo">D</div>
      <button class="rail-btn" title="Project">⌘</button>
      <button class="rail-btn active" title="Products">□</button>
      <button class="rail-btn" title="Topology">▦</button>
      <button class="rail-btn" title="Report">▤</button>
      <button class="rail-btn" title="Map">⌖</button>
      <div style="flex:1"></div>
      <button class="rail-btn" title="Menu">☰</button>
    </nav>

    <section class="main-shell">
      <header class="topbar">
        <button class="save-btn" id="saveProjectBtn">▣ Save As a New Project</button>
        <div class="top-right">
          <button class="lang-toggle" id="languageLabel">Global-English</button>
          <button class="rail-btn" title="Settings">⚙</button>
          <button class="login">Log In</button>
        </div>
      </header>

      <div class="searchbar">
        <div class="searchbox">
          <input id="keyword" placeholder="Enter keywords. Multiple keywords should be separated by space.">
          <button id="searchBtn">⌕</button>
        </div>
        <div></div>
        <button class="selected-top" id="selectedTop">🛒 Selected Products (0)</button>
      </div>

      <div class="workspace" id="workspace">
        <aside class="directory">
          <div class="dir-search">⌕ <input id="directorySearch" placeholder="Search Directory"></div>
          <div class="brand-select">HIKVISION <span>⌄</span></div>
          <div class="category-list" id="categoryList"></div>
          <div class="clear-all" id="clearAll">Clear All</div>
        </aside>

        <main class="catalog">
          <div class="catalog-toolbar">
            <div class="catalog-meta">
              <strong id="totalLabel">Total: 0</strong>
              <label class="checkbox-line"><span class="small-box"></span><span id="newOnlyText">Display New Products Only</span></label>
            </div>
            <div class="sort-area">
              <select class="sort-select" id="sortSelect">
                <option value="default">Default</option>
                <option value="models">Model Count</option>
                <option value="diffs">Diff Coverage</option>
                <option value="name">Name</option>
              </select>
              <button class="view-btn active" title="Grid">▦</button>
              <button class="view-btn" title="List">☰</button>
            </div>
          </div>
          <div class="product-grid" id="productGrid"></div>
        </main>

        <aside class="selection" id="selectionDrawer">
          <div class="selected-head"><strong id="selectedHead">Selected Products (0)</strong><button class="drawer-close" id="drawerClose" title="Close">×</button></div>
          <div class="scenario-panel">
            <div class="scenario-row">
              <select id="scenarioSelect"></select>
              <button id="applyScenario">Generate</button>
            </div>
            <div class="metric-row" id="metricRow"></div>
          </div>
          <div class="selected-list" id="selectedList"></div>
          <div class="selected-actions">
            <div class="tool-tabs">
              <button class="active" data-tool="topology">Topology</button>
              <button data-tool="bom">BOM</button>
              <button data-tool="source">Source</button>
            </div>
            <div class="output-body">
              <div id="topologyRender"></div>
              <div class="bom" id="bomWrap"></div>
            </div>
            <div class="export-row">
              <button id="copyBtn">Copy Diagram</button>
              <button id="svgBtn">Export SVG</button>
              <button id="jsonBtn">Export BOM</button>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </div>

  <script>
    const state = {
      locale: (() => {
        const site = new URLSearchParams(location.search).get("site");
        return site === "cn" || site === "zh" ? "cn" : "en";
      })(),
      category: "camera",
      keyword: "",
      directoryQuery: "",
      sort: "default",
      scenarioId: "video",
      metrics: {},
      selected: [],
      drawerOpen: true,
      tool: "topology",
      data: null,
      mermaid: ""
    };

    const categoryOrder = ["camera", "recorder", "display", "switch", "accessory", "access", "intercom", "alarm", "parking", "thermal", "software", "storage", "server", "audio", "fire", "ptz"];
    const categoryText = {
      camera: "Cameras Products",
      recorder: "Backend Products",
      display: "Display and Control",
      switch: "Networking",
      accessory: "Accessories",
      access: "Access Control Products",
      intercom: "Video Intercom Products",
      alarm: "Alarm Products",
      parking: "Parking Management",
      thermal: "Thermal Products",
      software: "Software",
      storage: "Intelligent Storage",
      server: "Server Products",
      audio: "Audio Products",
      fire: "Fire Products",
      ptz: "PTZ Cameras"
    };
    const cnCategoryText = {
      camera: "摄像机产品",
      recorder: "后端录像产品",
      display: "显示与控制",
      switch: "网络传输",
      accessory: "配件",
      access: "门禁产品",
      intercom: "可视对讲",
      alarm: "报警产品",
      parking: "停车管理",
      thermal: "热成像产品",
      software: "软件平台",
      storage: "智能存储",
      server: "服务器产品",
      audio: "音频产品",
      fire: "消防产品",
      ptz: "云台球机"
    };
    const metricNames = {
      cameras: ["Cameras", "摄像机"], ptz: ["PTZ", "球机"], recorders: ["NVR", "录像机"], switches: ["Switch", "交换机"],
      displays: ["Display", "显示"], retentionDays: ["Days", "天数"], doors: ["Doors", "门点"], readers: ["Readers", "读卡器"],
      controllers: ["Controllers", "控制器"], clients: ["Client", "客户端"], lanes: ["Lanes", "车道"], barriers: ["Barrier", "道闸"],
      entrances: ["Entrances", "入口"], indoorStations: ["Indoor", "室内机"], detectors: ["Detector", "探测器"], panels: ["Panel", "主机"],
      sirens: ["Siren", "声光"]
    };

    const $ = (id) => document.getElementById(id);

    Promise.all([
      fetch("./selector-data.json").then((response) => response.json()),
      new Promise((resolve) => {
        if (window.mermaid) resolve();
        window.addEventListener("mermaid-ready", resolve, { once: true });
      })
    ]).then(([data]) => {
      state.data = data;
      state.locale = data.families[state.locale] ? state.locale : (data.families.en ? "en" : Object.keys(data.families)[0]);
      state.metrics = { ...getScenario().defaults };
      applyScenarioSelection();
      bind();
      render();
    });

    function bind() {
      $("selectedTop").addEventListener("click", () => {
        state.drawerOpen = true;
        renderDrawerState();
      });
      $("drawerClose").addEventListener("click", () => {
        state.drawerOpen = false;
        renderDrawerState();
      });
      $("languageLabel").addEventListener("click", () => {
        state.locale = state.locale === "en" ? "cn" : "en";
        state.category = categoryOrder.find((key) => state.data.families[state.locale]?.[key]?.length) || state.category;
        state.metrics = { ...getScenario().defaults };
        applyScenarioSelection();
        render();
      });
      $("keyword").addEventListener("input", (event) => { state.keyword = event.target.value; renderProducts(); });
      $("directorySearch").addEventListener("input", (event) => { state.directoryQuery = event.target.value; renderCategories(); });
      $("sortSelect").addEventListener("change", (event) => { state.sort = event.target.value; renderProducts(); });
      $("categoryList").addEventListener("click", (event) => {
        const row = event.target.closest("[data-category]");
        if (!row) return;
        state.category = row.dataset.category;
        renderCategories();
        renderProducts();
      });
      $("productGrid").addEventListener("click", (event) => {
        const detail = event.target.closest("[data-detail]");
        const add = event.target.closest("[data-add]");
        if (!detail && !add) return;
        const item = productResults().shown.find((entry) => entry.cardId === (detail?.dataset.detail || add?.dataset.add));
        if (!item) return;
        if (detail) showDetails(item);
        if (add) {
          addProduct(item, item.category);
          state.drawerOpen = true;
          renderDrawerState();
        }
      });
      $("selectedList").addEventListener("click", (event) => {
        const inc = event.target.closest("[data-inc]");
        const dec = event.target.closest("[data-dec]");
        const remove = event.target.closest("[data-remove]");
        const key = inc?.dataset.inc || dec?.dataset.dec || remove?.dataset.remove;
        if (!key) return;
        const item = state.selected.find((entry) => entry.uid === key);
        if (!item) return;
        if (inc) item.qty += 1;
        if (dec) item.qty = Math.max(1, item.qty - 1);
        if (remove) state.selected = state.selected.filter((entry) => entry.uid !== key);
        renderSelection();
        renderOutput();
      });
      $("selectedList").addEventListener("input", (event) => {
        const input = event.target.closest("[data-qty]");
        if (!input) return;
        const item = state.selected.find((entry) => entry.uid === input.dataset.qty);
        if (item) item.qty = Math.max(1, Number(input.value || 1));
        renderOutput();
      });
      $("scenarioSelect").addEventListener("change", (event) => {
        state.scenarioId = event.target.value;
        state.metrics = { ...getScenario().defaults };
        renderMetrics();
      });
      $("applyScenario").addEventListener("click", () => {
        applyScenarioSelection();
        render();
      });
      $("metricRow").addEventListener("input", (event) => {
        const input = event.target.closest("[data-metric]");
        if (!input) return;
        state.metrics[input.dataset.metric] = Math.max(0, Number(input.value || 0));
        renderOutput();
      });
      document.querySelector(".tool-tabs").addEventListener("click", (event) => {
        const button = event.target.closest("[data-tool]");
        if (!button) return;
        state.tool = button.dataset.tool;
        document.querySelectorAll("[data-tool]").forEach((tab) => tab.classList.toggle("active", tab === button));
        renderOutput();
      });
      $("clearAll").addEventListener("click", () => {
        state.selected = [];
        renderSelection();
        renderOutput();
      });
      $("copyBtn").addEventListener("click", async () => {
        await navigator.clipboard.writeText(state.mermaid);
        const old = $("copyBtn").textContent;
        $("copyBtn").textContent = "Copied";
        setTimeout(() => { $("copyBtn").textContent = old; }, 1200);
      });
      $("svgBtn").addEventListener("click", exportSvg);
      $("jsonBtn").addEventListener("click", exportJson);
    }

    function render() {
      renderChromeLabels();
      renderDrawerState();
      $("scenarioSelect").innerHTML = state.data.scenarios.map((scenario) => `<option value="${escapeHtml(scenario.id)}"${scenario.id === state.scenarioId ? " selected" : ""}>${escapeHtml(scenario.labels[state.locale])}</option>`).join("");
      renderMetrics();
      renderCategories();
      renderProducts();
      renderSelection();
      renderOutput();
    }

    function renderChromeLabels() {
      const isCn = state.locale === "cn";
      $("languageLabel").textContent = isCn ? "简体中文" : "Global-English";
      $("keyword").placeholder = isCn ? "请输入关键词，多个关键词用空格分隔。" : "Enter keywords. Multiple keywords should be separated by space.";
      $("directorySearch").placeholder = isCn ? "搜索目录" : "Search Directory";
      $("saveProjectBtn").textContent = isCn ? "▣ 另存为新项目" : "▣ Save As a New Project";
      $("searchBtn").textContent = "⌕";
      $("applyScenario").textContent = isCn ? "生成" : "Generate";
      $("clearAll").textContent = isCn ? "清空全部" : "Clear All";
      $("newOnlyText").textContent = isCn ? "仅显示新产品" : "Display New Products Only";
      document.querySelector(".login").textContent = isCn ? "登录" : "Log In";
      const sortLabels = isCn ? ["默认", "型号数量", "差异覆盖", "名称"] : ["Default", "Model Count", "Diff Coverage", "Name"];
      Array.from($("sortSelect").options).forEach((option, index) => { option.textContent = sortLabels[index]; });
      const labels = isCn ? ["拓扑", "BOM", "源码"] : ["Topology", "BOM", "Source"];
      document.querySelectorAll("[data-tool]").forEach((button, index) => { button.textContent = labels[index]; });
      $("copyBtn").textContent = isCn ? "复制拓扑" : "Copy Diagram";
      $("svgBtn").textContent = isCn ? "导出 SVG" : "Export SVG";
      $("jsonBtn").textContent = isCn ? "导出 BOM" : "Export BOM";
    }

    function renderDrawerState() {
      $("workspace").classList.toggle("drawer-open", state.drawerOpen);
    }

    function renderCategories() {
      const q = state.directoryQuery.trim().toLowerCase();
      const groups = state.data.families[state.locale] || {};
      const rows = categoryOrder
        .filter((key) => groups[key]?.length)
        .filter((key) => !q || labelForCategory(key).toLowerCase().includes(q))
        .map((key) => {
          const active = key === state.category ? " active" : "";
          const count = groups[key].reduce((sum, product) => sum + (product.models?.length || product.modelCount || 1), 0);
          return `<div class="category-row${active}" data-category="${escapeHtml(key)}"><span class="twisty">›</span><span class="box"></span><span class="category-name">${escapeHtml(labelForCategory(key))}</span><span class="cat-count">${count}</span></div>`;
        });
      $("categoryList").innerHTML = rows.join("");
    }

    function renderProducts() {
      const result = productResults();
      $("totalLabel").textContent = `${state.locale === "cn" ? "总数" : "Total"}: ${result.total}`;
      const cards = result.shown.map((product, index) => productCard(product, index)).join("");
      const note = result.total > result.shown.length
        ? `<div class="result-note">${state.locale === "cn" ? `已显示前 ${result.shown.length} 个型号，可继续搜索缩小范围` : `Showing first ${result.shown.length} models. Use search to narrow all results.`}</div>`
        : "";
      $("productGrid").innerHTML = cards ? `${cards}${note}` : `<div class="empty">${state.locale === "cn" ? "暂无产品" : "No products"}</div>`;
    }

    function productCard(item, index) {
      const product = item.product;
      const isNew = index < 8 ? `<span class="new-tag">New</span>` : "";
      return `
        <article class="product-card">
          <div class="tag-row"><span class="mini-tag">SPEC</span><span class="mini-tag">VS</span><span class="star">☆</span></div>
          <div class="visual"><div class="device ${deviceClass(item.category)}"></div></div>
          <div class="card-info">
            <div class="product-title">${escapeHtml(item.model)}${isNew}</div>
            <div class="product-desc">${escapeHtml(product.name)} · ${product.modelCount} models · ${product.diffFields} diff fields</div>
          </div>
          <div class="hover-actions">
            <button data-detail="${escapeHtml(item.cardId)}">Details</button>
            <button data-add="${escapeHtml(item.cardId)}">Add</button>
          </div>
        </article>
      `;
    }

    function renderMetrics() {
      const scenario = getScenario();
      $("metricRow").innerHTML = Object.keys(scenario.defaults).slice(0, 6).map((key) => {
        const label = metricNames[key]?.[state.locale === "cn" ? 1 : 0] || key;
        return `<div class="metric"><label>${escapeHtml(label)}</label><input data-metric="${escapeHtml(key)}" type="number" min="0" value="${Number(state.metrics[key] || 0)}"></div>`;
      }).join("");
    }

    function renderSelection() {
      const selectedTitle = state.locale === "cn" ? "已选产品" : "Selected Products";
      $("selectedHead").textContent = `${selectedTitle} (${state.selected.length})`;
      $("selectedTop").textContent = `🛒 ${selectedTitle} (${state.selected.length})`;
      if (!state.selected.length) {
        $("selectedList").innerHTML = `<div class="empty">${state.locale === "cn" ? "暂无已选产品" : "No selected products"}</div>`;
        return;
      }
      $("selectedList").innerHTML = state.selected.map((item) => `
        <div class="selected-item">
          <div>
            <strong>${escapeHtml(item.model)}</strong>
            <span>${escapeHtml(item.product.name)} · ${escapeHtml(labelForCategory(item.category))}</span>
            <a href="${escapeHtml(item.url || item.product.url)}" target="_blank" rel="noreferrer">${state.locale === "cn" ? "详情" : "Details"}</a>
          </div>
          <div>
            <div class="qty-controls">
              <button data-dec="${escapeHtml(item.uid)}">-</button>
              <input data-qty="${escapeHtml(item.uid)}" value="${item.qty}">
              <button data-inc="${escapeHtml(item.uid)}">+</button>
            </div>
            <button style="margin-top:6px;width:90px;height:24px;border:1px solid #ccc;background:#fff" data-remove="${escapeHtml(item.uid)}">${state.locale === "cn" ? "移除" : "Remove"}</button>
          </div>
        </div>
      `).join("");
    }

    function renderOutput() {
      const source = buildMermaid();
      state.mermaid = source;
      if (state.tool === "source") {
        $("topologyRender").innerHTML = `<pre style="white-space:pre-wrap;margin:0;font-size:12px">${escapeHtml(source)}</pre>`;
      } else {
        renderMermaid(source);
      }
      renderBom();
    }

    async function renderMermaid(source) {
      try {
        const result = await window.mermaid.render(`topology-${Date.now()}`, source);
        $("topologyRender").innerHTML = result.svg;
      } catch (error) {
        $("topologyRender").innerHTML = `<pre>${escapeHtml(error.message)}\n${escapeHtml(source)}</pre>`;
      }
    }

    function renderBom() {
      const rows = state.selected.map((item) => `<tr><td>${escapeHtml(item.model)}</td><td>${item.qty}</td><td>${escapeHtml(labelForCategory(item.category))}</td></tr>`).join("");
      const headers = state.locale === "cn"
        ? ["型号", "数量", "类别"]
        : ["Model", "Qty", "Category"];
      $("bomWrap").innerHTML = state.tool === "topology"
        ? `<table><thead><tr><th>${headers[0]}</th><th>${headers[1]}</th><th>${headers[2]}</th></tr></thead><tbody>${rows}</tbody></table>`
        : `<table><thead><tr><th>${headers[0]}</th><th>${headers[1]}</th><th>${headers[2]}</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function buildMermaid() {
      const byCategory = new Map();
      for (const item of state.selected) {
        if (!byCategory.has(item.category)) byCategory.set(item.category, []);
        byCategory.get(item.category).push(item);
      }
      const lines = ["flowchart LR", "  client[Client / Control Center]", "  platform[Management Platform]"];
      if (byCategory.has("switch")) lines.push(`  switch[Network / Switch\\n${sumQty(byCategory.get("switch"))} pcs]`);
      if (byCategory.has("recorder")) lines.push(`  recorder[NVR / Storage\\n${sumQty(byCategory.get("recorder"))} pcs]`);
      if (byCategory.has("camera")) lines.push(`  camera[Cameras\\n${sumQty(byCategory.get("camera"))} pcs]`);
      if (byCategory.has("ptz")) lines.push(`  ptz[PTZ\\n${sumQty(byCategory.get("ptz"))} pcs]`);
      if (byCategory.has("access")) lines.push(`  access[Access Control\\n${sumQty(byCategory.get("access"))} pcs]`);
      if (byCategory.has("intercom")) lines.push(`  intercom[Video Intercom\\n${sumQty(byCategory.get("intercom"))} pcs]`);
      if (byCategory.has("parking")) lines.push(`  parking[Parking\\n${sumQty(byCategory.get("parking"))} pcs]`);
      if (byCategory.has("alarm") || byCategory.has("fire")) lines.push(`  alarm[Alarm / Fire\\n${sumQty([...(byCategory.get("alarm") || []), ...(byCategory.get("fire") || [])])} pcs]`);
      if (byCategory.has("display")) lines.push(`  display[Display Wall\\n${sumQty(byCategory.get("display"))} pcs]`);
      if (byCategory.has("audio")) lines.push(`  audio[Public Address\\n${sumQty(byCategory.get("audio"))} pcs]`);
      lines.push("  client --> platform");
      if (byCategory.has("switch")) lines.push("  platform --> switch");
      if (byCategory.has("camera")) lines.push(`  ${byCategory.has("switch") ? "switch" : "platform"} --> camera`);
      if (byCategory.has("ptz")) lines.push(`  ${byCategory.has("switch") ? "switch" : "platform"} --> ptz`);
      if (byCategory.has("recorder")) lines.push(`  ${byCategory.has("switch") ? "switch" : "platform"} --> recorder`);
      if (byCategory.has("access")) lines.push(`  ${byCategory.has("switch") ? "switch" : "platform"} --> access`);
      if (byCategory.has("intercom")) lines.push(`  ${byCategory.has("switch") ? "switch" : "platform"} --> intercom`);
      if (byCategory.has("parking")) lines.push(`  ${byCategory.has("switch") ? "switch" : "platform"} --> parking`);
      if (byCategory.has("alarm") || byCategory.has("fire")) lines.push("  platform --> alarm");
      if (byCategory.has("display")) lines.push("  platform --> display");
      if (byCategory.has("audio")) lines.push("  platform --> audio");
      lines.push("  classDef core fill:#eaf1ff,stroke:#2867f0,color:#111");
      lines.push("  classDef edge fill:#fff,stroke:#aeb7c2,color:#111");
      lines.push("  class client,platform,recorder core");
      return lines.join("\n");
    }

    function applyScenarioSelection() {
      const scenario = getScenario();
      state.selected = [];
      for (const role of scenario.roles) {
        const candidate = (state.data.families[state.locale]?.[role.category] || [])[0];
        if (!candidate) continue;
        addProduct(toModelItem(candidate, role.category, 0), role.category, Math.max(1, Number(state.metrics[role.qty] || 1)), false);
      }
    }

    function addProduct(item, category, qty = 1, rerender = true) {
      const product = item.product || item;
      const model = item.model || product.models?.[0]?.name || product.name;
      const url = item.url || product.models?.[0]?.url || product.url;
      const existing = state.selected.find((entry) => entry.product.id === product.id && entry.category === category && entry.model === model);
      if (existing) existing.qty += qty;
      else state.selected.push({ uid: `${product.id}-${category}-${model}-${Date.now()}-${Math.random().toString(16).slice(2)}`, product, category, model, url, qty });
      if (rerender) {
        renderSelection();
        renderOutput();
      }
    }

    function showDetails(item) {
      const product = item.product || item;
      const diff = product.differenceSummary?.map((item) => `${item.field}: ${item.values.join(" / ")}`).join("\n") || "No spec differences collected yet.";
      alert(`${item.model || product.name}\n\nSeries: ${product.name}\nModels: ${product.modelCount}\nCompared: ${product.comparedModels}\nDiff fields: ${product.diffFields}\n\n${diff}`);
    }

    function productResults() {
      const q = state.keyword.trim().toLowerCase().split(/\s+/).filter(Boolean);
      let list = (state.data.families[state.locale]?.[state.category] || []).flatMap((product) => {
        const models = product.models?.length ? product.models : [{ name: product.name, url: product.url }];
        return models.map((model, index) => toModelItem(product, state.category, index, model));
      });
      if (q.length) {
        list = list.filter((item) => {
          const haystack = [item.model, item.product.name, item.product.pathText].join(" ").toLowerCase();
          return q.every((word) => haystack.includes(word));
        });
      }
      if (state.sort === "models") list.sort((a, b) => b.product.modelCount - a.product.modelCount);
      if (state.sort === "diffs") list.sort((a, b) => b.product.diffFields - a.product.diffFields);
      if (state.sort === "name") list.sort((a, b) => a.model.localeCompare(b.model));
      return { total: list.length, shown: list.slice(0, 96) };
    }

    function toModelItem(product, category, index, model = product.models?.[index] || product.models?.[0]) {
      const modelName = model?.name || product.name;
      return {
        cardId: `${product.id}::${index}`,
        product,
        category,
        model: modelName,
        url: model?.url || product.url
      };
    }

    function getScenario() {
      return state.data.scenarios.find((scenario) => scenario.id === state.scenarioId) || state.data.scenarios[0];
    }

    function labelForCategory(key) {
      if (state.locale === "cn") return cnCategoryText[key] || state.data.categoryLabels[key]?.cn || key;
      return categoryText[key] || state.data.categoryLabels[key]?.en || key;
    }

    function deviceClass(category) {
      if (category === "ptz" || category === "thermal") return "ptz";
      if (["recorder", "switch", "storage", "server"].includes(category)) return "boxy";
      if (["access", "intercom", "display", "alarm", "fire", "audio", "parking"].includes(category)) return "panel";
      return "camera";
    }

    function sumQty(items) {
      return items.reduce((sum, item) => sum + Number(item.qty || 0), 0);
    }

    function exportSvg() {
      const svg = $("topologyRender").querySelector("svg");
      if (!svg) return;
      download("hikvision-topology.svg", new XMLSerializer().serializeToString(svg), "image/svg+xml");
    }

    function exportJson() {
      download("hikvision-bom.json", JSON.stringify({ selected: state.selected.map((item) => ({ model: item.model, series: item.product.name, category: labelForCategory(item.category), qty: item.qty, url: item.url || item.product.url })), mermaid: state.mermaid, generatedAt: new Date().toISOString() }, null, 2), "application/json");
    }

    function download(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
    }
  </script>
</body>
</html>
